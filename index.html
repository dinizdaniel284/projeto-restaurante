<!DOCTYPE html>
<html lang="pt-br">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Sistema Inteligente | Painel Administrativo</title>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">  
    <style>  
        :root {  
            --primary: #ffc107;  
            --dark: #0f0f0f;  
            --success: #25d366;  
            --gray: #f5f5f5;  
            --danger: #ff4444;
        }  
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }  
        body { background: var(--gray); overflow-x: hidden; }  
        
        /* NAVBAR */  
        .navbar { background: var(--dark); color: white; padding: 15px; position: sticky; top: 0; z-index: 1000; }  
        .nav-content { max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }  
        .logo { font-weight: bold; font-size: 1.4rem; cursor: pointer; }  
        .logo span { color: var(--primary); }  
        
        .admin-link { font-size: 0.8rem; color: #444; text-decoration: none; margin-left: 10px; cursor: pointer; }

        /* HERO */  
        .hero { height: 320px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1550547660-d9450f859349?w=1200'); background-size: cover; display: flex; align-items: center; justify-content: center; text-align: center; color: white; padding: 20px; }  
        .hero h1 { font-size: 2rem; margin-bottom: 10px; }  
        .hero button { margin-top: 20px; padding: 12px 20px; border: none; background: var(--primary); font-weight: bold; border-radius: 6px; cursor: pointer; }  

        /* PRODUTOS */  
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }  
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }  
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; }  
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 180px; object-fit: cover; }  
        .card-info { padding: 15px; }  
        .price { color: #2e7d32; font-weight: bold; margin: 10px 0; display: block; font-size: 1.2rem; }  
        .btn { width: 100%; padding: 10px; border: none; background: var(--dark); color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }  

        /* CARRINHO */  
        .cart-float { position: fixed; right: 20px; bottom: 20px; background: var(--success); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 999; }  
        .cart-box { position: fixed; right: -350px; top: 0; width: 320px; height: 100%; background: white; transition: 0.4s; padding: 25px; z-index: 1001; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }  
        .cart-box.active { right: 0; }  
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #eee; }

        /* PAINEL ADM (MODAL) */
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; color: white; overflow-y: auto; padding: 20px; }
        .admin-content { max-width: 800px; margin: auto; background: #222; padding: 30px; border-radius: 12px; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: none; margin-top: 5px; }
        .admin-table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid #444; text-align: left; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>  
</head>  
<body>  

<nav class="navbar">  
    <div class="nav-content">  
        <div class="logo" onclick="location.reload()">Sistema<span>Pedidos IA</span></div>  
        <div style="display: flex; align-items: center;">
            <div onclick="toggleCart()" style="cursor:pointer; font-size: 1.2rem;">  
                <i class="fa fa-shopping-cart"></i>  
                <span id="count" style="background: var(--primary); color: var(--dark); padding: 2px 7px; border-radius: 50%; font-size: 0.8rem; font-weight: bold;">0</span>  
            </div>  
            <span class="admin-link" onclick="openAdmin()">• Admin</span>
        </div>
    </div>  
</nav>  

<section class="hero">  
    <div>  
        <h1>Painel de Controle Inteligente</h1>  
        <p>Gerencie seus produtos e venda via WhatsApp com IA.</p>  
        <button onclick="scrollToMenu()">Ver Cardápio Atual</button>  
    </div>  
</section>  

<main class="container" id="menu">  
    <div class="grid" id="productGrid">
        </div>  
</main>  

<div class="cart-float" onclick="toggleCart()">
    <i class="fa fa-shopping-basket"></i>
</div>  

<div class="cart-box" id="cartBox">  
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3>Seu Pedido</h3>
        <i class="fa fa-times" onclick="toggleCart()" style="cursor:pointer"></i>
    </div>
    <div id="items"></div>  
    <div style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 10px;">
        <p><strong>Total: R$ <span id="total">0</span></strong></p>  
        <button class="btn" style="background:var(--success); margin-top:15px;" onclick="checkout()">
            <i class="fab fa-whatsapp"></i> Finalizar no WhatsApp
        </button>  
    </div>
</div>

<div id="adminPanel">
    <div class="admin-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Gerenciar Cardápio</h2>
            <button class="btn" style="width:auto; padding: 5px 20px;" onclick="closeAdmin()">Sair</button>
        </div>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #444;">
        
        <h3>Adicionar Novo Produto</h3>
        <div class="form-group">
            <input type="text" id="pName" placeholder="Nome do Produto (ex: Burger Especial)">
            <input type="number" id="pPrice" placeholder="Preço (ex: 35)">
            <input type="text" id="pImage" placeholder="URL da Imagem">
            <button class="btn" style="background: var(--primary); color: black; margin-top:10px;" onclick="saveProduct()">Salvar Produto</button>
        </div>

        <h3>Produtos Ativos</h3>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>
</div>

<script>  
    // Banco de dados inicial se estiver vazio
    let defaultProducts = [
        {id: 1, name: 'Master Bacon', price: 42, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500'},
        {id: 2, name: 'Smash Duplo', price: 38, image: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=500'},
        {id: 3, name: 'Executivo Prime', price: 55, image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'}
    ];

    let products = JSON.parse(localStorage.getItem('myProducts')) || defaultProducts;
    let cart = [];  

    // Iniciar sistema
    function init() {
        renderMenu();
        renderAdmin();
    }

    // Renderiza o menu do cliente
    function renderMenu() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = products.map(p => `
            <div class="card">  
                <img src="${p.image}">  
                <div class="card-info">  
                    <h3>${p.name}</h3>  
                    <span class="price">R$ ${p.price}</span>  
                    <button class="btn" onclick="addToCart('${p.name}', ${p.price})">Pedir Agora</button>  
                </div>  
            </div>
        `).join('');
    }

    // Funções do Carrinho
    function addToCart(name, price){  
        cart.push({name, price});  
        updateCart();  
    }  

    function updateCart(){  
        let html = '';  
        let total = 0;  
        cart.forEach(i => {  
            total += i.price;  
            html += `<div class="cart-item"><span>${i.name}</span> <span>R$ ${i.price}</span></div>`;  
        });  
        document.getElementById('items').innerHTML = html;  
        document.getElementById('total').innerText = total;  
        document.getElementById('count').innerText = cart.length;  
    }  

    function toggleCart(){  
        document.getElementById('cartBox').classList.toggle('active');  
    }  

    function checkout(){  
        if(cart.length === 0) return alert("Seu carrinho está vazio!");
        let text = cart.map(i => i.name).join(', ');  
        let total = document.getElementById('total').innerText;
        window.open(`https://wa.me/5511999999999?text=Olá! Gostaria de fazer esse pedido: ${text}. Total: R$ ${total}`);  
    }  

    // Funções Administrativas
    function openAdmin() {
        let pass = prompt("Digite a senha administrativa:");
        if(pass === "admin") {
            document.getElementById('adminPanel').style.display = 'block';
        } else {
            alert("Senha incorreta!");
        }
    }

    function closeAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
    }

    function saveProduct() {
        const name = document.getElementById('pName').value;
        const price = parseFloat(document.getElementById('pPrice').value);
        const image = document.getElementById('pImage').value || 'https://via.placeholder.com/500';

        if(name && price) {
            products.push({ id: Date.now(), name, price, image });
            localStorage.setItem('myProducts', JSON.stringify(products));
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            renderMenu();
            renderAdmin();
            alert("Produto adicionado!");
        }
    }

    function deleteProduct(id) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('myProducts', JSON.stringify(products));
        renderMenu();
        renderAdmin();
    }

    function renderAdmin() {
        const list = document.getElementById('adminList');
        list.innerHTML = products.map(p => `
            <tr>
                <td>${p.name}</td>
                <td>R$ ${p.price}</td>
                <td><button class="btn-danger" onclick="deleteProduct(${p.id})">Excluir</button></td>
            </tr>
        `).join('');
    }

    function scrollToMenu(){  
        document.getElementById('menu').scrollIntoView({behavior:'smooth'});  
    }

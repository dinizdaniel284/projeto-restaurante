<!DOCTYPE html>
<html lang="pt-br">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Sistema Inteligente | Painel Administrativo</title>  

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>  
:root {  
--primary:#ffc107;  
--dark:#0f0f0f;  
--success:#25d366;  
--gray:#f5f5f5;  
--danger:#ff4444;
}  

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}  
body{background:var(--gray);}  

/* NAV */
.navbar{background:var(--dark);color:white;padding:15px;position:sticky;top:0;}
.nav-content{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;}
.logo span{color:var(--primary);}
.admin-link{font-size:0.8rem;color:#888;cursor:pointer;margin-left:10px;}

/* HERO */
.hero{
height:320px;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url('https://images.unsplash.com/photo-1550547660-d9450f859349?w=1200');
background-size:cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}
.hero button{
margin-top:20px;
padding:12px 20px;
border:none;
background:var(--primary);
border-radius:6px;
cursor:pointer;
}

/* GRID */
.container{max-width:1200px;margin:30px auto;padding:20px;}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

/* CARD PREMIUM */
.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.08);
transition:.3s;
position:relative;
}
.card:hover{
transform:translateY(-8px) scale(1.02);
box-shadow:0 20px 40px rgba(0,0,0,.15);
}
.card img{
width:100%;
height:200px;
object-fit:cover;
}
.badge{
position:absolute;
top:10px;
left:10px;
background:#ff5722;
color:white;
padding:5px 10px;
font-size:.7rem;
border-radius:20px;
}
.card-info{padding:18px;}
.card-info h3{font-size:1.2rem;}
.price{
color:#2e7d32;
font-weight:bold;
font-size:1.3rem;
margin:10px 0;
display:block;
}
.btn{
width:100%;
padding:12px;
border:none;
background:linear-gradient(45deg,#0f0f0f,#333);
color:white;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:.3s;
}
.btn:hover{
background:linear-gradient(45deg,#ffc107,#ff9800);
color:black;
}

/* MAPA */
.map-section{
padding:60px 20px;
background:#0f0f0f;
color:white;
text-align:center;
}
.map-box{
max-width:900px;
margin:20px auto;
border-radius:15px;
overflow:hidden;
border:4px solid var(--primary);
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
iframe{
width:100%;
height:350px;
border:none;
}

/* CART */
.cart-float{
position:fixed;
right:20px;
bottom:20px;
background:var(--success);
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}
.cart-box{
position:fixed;
right:-320px;
top:0;
width:300px;
height:100%;
background:white;
padding:20px;
transition:.4s;
}
.cart-box.active{right:0;}

/* ADMIN */
#adminPanel{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000ee;
color:white;
padding:20px;
}
.admin-content{
max-width:700px;
margin:auto;
background:#222;
padding:20px;
border-radius:10px;
}
input{
width:100%;
padding:10px;
margin-bottom:10px;
}
.btn-danger{
background:red;
color:white;
border:none;
padding:5px 10px;
cursor:pointer;
}
</style>  
</head>  

<body>  

<nav class="navbar">  
<div class="nav-content">  
<div class="logo">Sistema<span>Pedidos IA</span></div>  
<div>
<span onclick="toggleCart()">🛒 <span id="count">0</span></span>
<span class="admin-link" onclick="openAdmin()">Admin</span>
</div>
</div>  
</nav>  

<section class="hero">  
<div>  
<h1>Pedidos automáticos no WhatsApp</h1>  
<button onclick="scrollToMenu()">Ver Cardápio</button>  
</div>  
</section>  

<main class="container" id="menu">  
<div class="grid" id="productGrid"></div>  
</main>  

<!-- MAPA (CORRIGIDO E MANTIDO) -->
<section class="map-section">  
<h2>📍 Nossa Localização</h2>  
<p>Atendendo toda a região de Santa Rita do Passa Quatro</p>  

<div class="map-box">
<iframe src="https://www.google.com/maps?q=Santa+Rita+do+Passa+Quatro&output=embed"></iframe>
</div>
</section>

<div class="cart-float" onclick="toggleCart()">🛒</div>  

<div class="cart-box" id="cartBox">  
<h3>Pedido</h3>  
<div id="items"></div>  
<p>Total: R$ <span id="total">0</span></p>  
<button onclick="checkout()" class="btn" style="background:green;">WhatsApp</button>  
</div>  

<!-- ADMIN -->
<div id="adminPanel">
<div class="admin-content">
<h2>Painel</h2>

<input id="pName" placeholder="Nome">
<input id="pPrice" placeholder="Preço">
<input id="pImage" placeholder="Imagem">

<button class="btn" onclick="saveProduct()">Adicionar</button>

<div id="adminList"></div>

<button onclick="closeAdmin()">Fechar</button>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('myProducts')) || [
{id:1,name:'Master Bacon',price:42,image:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500'},
{id:2,name:'Smash Duplo',price:38,image:'https://images.unsplash.com/photo-1550547660-d9450f859349?w=500'}
];

let cart=[];

function renderMenu(){
document.getElementById('productGrid').innerHTML=products.map(p=>`
<div class="card">
<div style="position:relative;">
<img src="${p.image}">
<span class="badge">🔥 Mais vendido</span>
</div>

<div class="card-info">
<h3>${p.name}</h3>
<span class="price">R$ ${p.price}</span>
<button class="btn" onclick="add('${p.name}',${p.price})">Adicionar</button>
</div>
</div>
`).join('');
}

function add(n,p){cart.push({n,p});updateCart();}

function updateCart(){
let html='';let total=0;
cart.forEach(i=>{total+=i.p;html+=`<p>${i.n} - R$ ${i.p}</p>`});
document.getElementById('items').innerHTML=html;
document.getElementById('total').innerText=total;
document.getElementById('count').innerText=cart.length;
}

function toggleCart(){
document.getElementById('cartBox').classList.toggle('active');
}

function checkout(){
let msg=cart.map(i=>i.n).join(', ');
window.open(`https://wa.me/5511999999999?text=Pedido: ${msg}`);
}

function openAdmin(){
let pass=prompt("Senha:");
if(pass==="admin") document.getElementById('adminPanel').style.display='block';
}

function closeAdmin(){
document.getElementById('adminPanel').style.display='none';
}

function saveProduct(){
let name=document.getElementById('pName').value;
let price=document.getElementById('pPrice').value;
let image=document.getElementById('pImage').value;

products.push({id:Date.now(),name,price,image});
localStorage.setItem('myProducts',JSON.stringify(products));
renderMenu();
}

function scrollToMenu(){
document.getElementById('menu').scrollIntoView({behavior:'smooth'});
}

renderMenu();
</script>  

</body>  
</html>

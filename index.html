<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Inteligente de Pedidos</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
--primary: #ffc107;
--dark: #0f0f0f;
--success: #25d366;
--gray: #f5f5f5;
}

* {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body {background: var(--gray);}

/* NAV */
.navbar {
background: var(--dark);
color:white;
padding:15px;
position:sticky;
top:0;
}

.nav-content {
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
}

.logo span {color: var(--primary);}

/* HERO */
.hero {
height:300px;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url('https://images.unsplash.com/photo-1550547660-d9450f859349?w=1200');
background-size:cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero button {
margin-top:20px;
padding:10px 20px;
border:none;
background:var(--primary);
cursor:pointer;
}

/* GRID */
.container {max-width:1200px;margin:30px auto;padding:20px;}

.grid {
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card {
background:white;
border-radius:10px;
overflow:hidden;
}

.card img {width:100%;height:180px;object-fit:cover;}

.card-info {padding:15px;}

.price {color:green;font-weight:bold;}

.btn {
width:100%;
padding:10px;
border:none;
background:black;
color:white;
cursor:pointer;
}

/* CART */
.cart {
position:fixed;
right:20px;
bottom:20px;
background:var(--success);
color:white;
padding:15px;
border-radius:50%;
cursor:pointer;
}

.cart-box {
position:fixed;
right:-300px;
top:0;
width:300px;
height:100%;
background:white;
padding:20px;
transition:.4s;
}

.cart-box.active {right:0;}

/* ADMIN */
#adminPanel {
position:fixed;
left:-300px;
top:0;
width:300px;
height:100%;
background:#111;
color:white;
padding:20px;
transition:.4s;
}

#adminPanel input {
width:100%;
padding:8px;
margin-bottom:10px;
}
</style>
</head>

<body>

<nav class="navbar">
<div class="nav-content">
<div class="logo">Sistema<span>Pedidos IA</span></div>
<div onclick="toggleCart()" style="cursor:pointer;">
<i class="fa fa-shopping-cart"></i>
<span id="count">0</span>
</div>
</div>
</nav>

<section class="hero">
<div>
<h1>Pedidos automáticos no WhatsApp</h1>
<button onclick="scrollToMenu()">Ver Cardápio</button>
</div>
</section>

<main class="container" id="menu">
<div class="grid"></div>
</main>

<div class="cart" onclick="toggleCart()">🛒</div>

<div class="cart-box" id="cartBox">
<h3>Seu Pedido</h3>
<div id="items"></div>
<p>Total: R$ <span id="total">0</span></p>
<button onclick="checkout()" class="btn" style="background:green;">Finalizar</button>
</div>

<!-- LOGIN -->
<div id="loginBox" style="display:none;position:fixed;width:100%;height:100%;background:#000000cc;top:0;left:0;align-items:center;justify-content:center;">
<div style="background:white;padding:20px;border-radius:10px;">
<h3>Login Admin</h3>
<input type="password" id="senha" placeholder="Senha">
<button onclick="login()">Entrar</button>
</div>
</div>

<!-- ADMIN -->
<div id="adminPanel">
<h3>Painel</h3>

<input id="nome" placeholder="Nome">
<input id="preco" placeholder="Preço">
<input id="img" placeholder="URL imagem">

<button onclick="addProduct()">Adicionar</button>
</div>

<button onclick="openLogin()" style="position:fixed;left:20px;bottom:20px;">⚙️</button>

<script>
let cart = [];

let produtos = JSON.parse(localStorage.getItem('produtos')) || [
{nome:'Hambúrguer',preco:30,img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500'},
{nome:'Pizza',preco:50,img:'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'}
];

function renderProdutos(){
let html='';
produtos.forEach(p=>{
html+=`
<div class="card">
<img src="${p.img}">
<div class="card-info">
<h3>${p.nome}</h3>
<span class="price">R$ ${p.preco}</span>
<button class="btn" onclick="add('${p.nome}',${p.preco})">Adicionar</button>
</div>
</div>`;
});
document.querySelector('.grid').innerHTML=html;
}

function add(n,p){
cart.push({n,p});
render();
}

function render(){
let html='';
let total=0;
cart.forEach(i=>{
total+=i.p;
html+=`<p>${i.n} - R$ ${i.p}</p>`;
});
document.getElementById('items').innerHTML=html;
document.getElementById('total').innerText=total;
document.getElementById('count').innerText=cart.length;
}

function toggleCart(){
document.getElementById('cartBox').classList.toggle('active');
}

function checkout(){
let msg=cart.map(i=>i.n).join(', ');
window.open(`https://wa.me/5511999999999?text=Pedido: ${msg}`);
}

function scrollToMenu(){
document.getElementById('menu').scrollIntoView({behavior:'smooth'});
}

/* ADMIN */
function openLogin(){
document.getElementById('loginBox').style.display='flex';
}

function login(){
let s=document.getElementById('senha').value;
if(s==='1234'){
document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.left='0';
}else{
alert('Senha errada');
}
}

function addProduct(){
let nome=document.getElementById('nome').value;
let preco=document.getElementById('preco').value;
let img=document.getElementById('img').value;

produtos.push({nome,preco,img});
localStorage.setItem('produtos',JSON.stringify(produtos));

renderProdutos();
}

renderProdutos();
</script>

</body>
  </html>
